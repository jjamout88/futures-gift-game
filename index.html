async function makeShare(){const d=window.__shr;try{await document.fonts.ready}catch(e){}
const W=540,H=900,cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d');c.imageSmoothingEnabled=false;
const F=s=>`bold ${s}px "DungGeunMo","Galmuri11","Press Start 2P",monospace`;
c.fillStyle='#0d0e17';c.fillRect(0,0,W,H);for(let i=0;i<60;i++){c.fillStyle=i%3?'#2b2f4a':'#f7d354';c.fillRect((i*97)%W,(i*53)%H,4,4)}
const box=(x,y,w,h,f)=>{c.fillStyle='#000';c.fillRect(x+8,y+8,w,h);c.fillStyle='#f4f4f4';c.fillRect(x-6,y-6,w+12,h+12);c.fillStyle=f;c.fillRect(x,y,w,h)};
c.textAlign='center';c.textBaseline='middle';const tx=(s,x,y,sz,col,sh=1)=>{c.font=F(sz);if(sh){c.fillStyle='#000';c.fillText(s,x+4,y+4)}c.fillStyle=col;c.fillText(s,x,y)};
tx('🍌 바나나스닥 🍌',W/2,60,40,'#f7d354');tx('매매결과',W/2,112,30,'#ef7d57');
box(40,150,W-80,640,'#1f2240');tx('당신의 칭호',W/2,190,20,'#9aa0c0',0);tx(d.tt[1],W/2,240,46,'#ffcd2e');
const pc=document.createElement('canvas');pc.width=132;pc.height=132;drawPortrait(pc,d.tt[3]);c.fillStyle='#000';c.fillRect(W/2-138,282,276,276);c.drawImage(pc,W/2-132,288,264,264);
const col=d.ret>=0?'#ff5a5a':'#4fa3ff',rows=[['최종 잔고',fmt(d.bal),col],['수익률',(d.ret>=0?'+':'')+d.ret.toFixed(2)+'%',col],['최고 콤보',d.combo+'콤보','#f4f4f4']];
rows.forEach((r,i)=>{const y=610+i*58;c.textAlign='left';tx(r[0],76,y,24,'#c8cce0',0);c.textAlign='right';tx(r[2]&&r[1],W-76,y,30,r[2]);c.fillStyle='#3a3f66';c.fillRect(76,y+28,W-152,3)});
c.textAlign='center';tx('너도 2분 NQ 단타 ㄱㄱ',W/2,830,22,'#f4f4f4',0);tx(GURL.replace('https://',''),W/2,866,13,'#f7d354',0);
return new Promise(r=>cv.toBlob(r,'image/png'))}
async function shareCard(){const d=window.__shr;let b;try{b=await makeShare()}catch(e){toast('이미지 생성 실패');return}window.__shareBlob=b;

function drawSil(cv,kind){drawPortrait(cv,kind);const c=cv.getContext('2d'),W=cv.width,H=cv.height;c.fillStyle='#262b44';c.fillRect(0,0,W,H);const t=document.createElement('canvas');t.width=W;t.height=H;const x=t.getContext('2d');x.imageSmoothingEnabled=false;draw(x,spr(face.idle),36,48,6);draw(x,spr(body),36,90,6);x.globalCompositeOperation='source-in';x.fillStyle='#000';x.fillRect(0,0,W,H);c.drawImage(t,0,0)}
let dxTab='ret';
function renderDex(){const got=new Set(DEX.get()),nw=new Set(DEX.nw);const all=TITLES.map((t,i)=>[t[1],t[2],t[3],retCond(i)]).concat(SPECIALS.map((x,i)=>[x[0],x[1],x[2],SPC[i]]));const n=all.filter(a=>got.has(a[0])).length;$('dxN').textContent='획득 '+n+'/'+all.length;
 const list=dxTab==='ret'?all.slice(0,TITLES.length):all.slice(TITLES.length);const g=$('dxGrid');g.classList.toggle('sp',dxTab!=='ret');g.innerHTML='';g.scrollTop=0;
