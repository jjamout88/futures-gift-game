function renderDex(){const got=new Set(DEX.get()),nw=new Set(DEX.nw);const all=TITLES.map((t,i)=>[t[1],t[2],t[3],retCond(i)]).concat(SPECIALS.map((x,i)=>[x[0],x[1],x[2],SPC[i]]));const n=all.filter(a=>got.has(a[0])).length;$('dxN').textContent='획득 '+n+'/'+all.length;
 const list=dxTab==='ret'?all.slice(0,TITLES.length):all.slice(TITLES.length);const g=$('dxGrid');g.classList.toggle('sp',dxTab!=='ret');g.innerHTML='';g.scrollTop=0;
 list.forEach(a=>{const ok=got.has(a[0]);const d=document.createElement('div');d.className='dxc'+(ok?'':' lock');const cv=document.createElement('canvas');cv.width=132;cv.height=132;ok?drawPortrait(cv,a[2]):drawSil(cv,a[2]);d.appendChild(cv);d.insertAdjacentHTML('beforeend',`<div class="n">${ok?a[0]:'???'}</div>`+(ok||dxTab==='ret'?`<div class="d">${ok?a[1]:'???'}</div>`:'')+(dxTab==='ret'?`<div class="c">${a[3]}</div>`:'')+(ok&&nw.has(a[0])?'<div class="new">NEW</div>':''));g.appendChild(d)})}
$('dex').onclick=()=>{snd(880,.06);$('dexScr').classList.remove('hide');renderDex()};
$('dxClose').onclick=()=>{snd(660,.05);$('dexScr').classList.add('hide')};
document.querySelectorAll('#dxTabs button').forEach(b=>b.onclick=()=>{dxTab=b.dataset.t;document.querySelectorAll('#dxTabs button').forEach(x=>x.classList.toggle('on',x===b));renderDex()});
})();
